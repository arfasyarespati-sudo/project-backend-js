<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Membuat Website</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #34495e;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        main {
            flex: 3; 
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
        }

        article {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        aside {
            flex: 1;
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        aside img {
            width: 100%;
            max-width: 200px;
            height: auto;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        footer {
            background-color: #000000;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: auto; 
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>My Website </h1>
        <p>For a Submission of dicoding</p>
    </header>

    <nav>
        <a href="https://www.dicoding.com/users/arpasyahh" target="_blank">Profil Dicoding</a>
    </nav>

    <div class="container">
        <main>
            <article>
                <h2>Hai pembaca!</h2>
                <p>Selamat datang di website ku!</p>
                
            </article>
        </main>

        <aside>
            <h3>Tentang Saya</h3>
            <img src="https://picsum.photos/200" alt="Foto Profil">
            <p>Seorang mahasiswa yang sedang belajar pengembangan web front-end.</p>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 Submission Web. Dibuat dengan Flexbox.</p>
    </footer>

</body>
</html>
